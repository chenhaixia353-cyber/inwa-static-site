# Deploy a release-* branch to Tencent Cloud COS.
#
# The build runs on every push to a release-* branch. The deploy job waits on
# the `cos-release` environment, so it only runs after a reviewer approves it:
# Settings → Environments → cos-release → Required reviewers.

name: Deploy release to Tencent COS

on:
  push:
    branches:
      - 'release-*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cos-release
  cancel-in-progress: false

env:
  BUILD_PATH: .
  SITE_URL: ${{ vars.SITE_URL || 'https://i-space.design' }}
  COS_BUCKET: ${{ vars.COS_BUCKET || secrets.COS_BUCKET }}
  COS_REGION: ${{ vars.COS_REGION || secrets.COS_REGION }}
  COS_SECRET_ID: ${{ secrets.TENCENTCLOUD_SECRET_ID || secrets.TENCENT_CLOUD_SECRET_ID }}
  COS_SECRET_KEY: ${{ secrets.TENCENTCLOUD_SECRET_KEY || secrets.TENCENT_CLOUD_SECRET_KEY }}

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check COS configuration
        run: |
          for name in COS_BUCKET COS_REGION COS_SECRET_ID COS_SECRET_KEY; do
            if [ -z "${!name}" ]; then
              echo "::error::$name is not set"
              exit 1
            fi
          done

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: ${{ env.BUILD_PATH }}/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: ${{ env.BUILD_PATH }}

      - name: Build with Astro
        run: npx astro build --base "/"
        working-directory: ${{ env.BUILD_PATH }}
        env:
          PUBLIC_BAIDU_ID: ${{ vars.PUBLIC_BAIDU_ID }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: site
          path: ${{ env.BUILD_PATH }}/dist
          include-hidden-files: true
          if-no-files-found: error

  deploy:
    name: Deploy to Tencent COS
    needs: build
    runs-on: ubuntu-latest
    environment: cos-release
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: site
          path: dist

      - name: Install COSCLI
        shell: bash
        run: |
          curl --fail --location --retry 3 \
            https://github.com/tencentyun/coscli/releases/download/v1.0.9/coscli-v1.0.9-linux-amd64 \
            --output "$RUNNER_TEMP/coscli"
          chmod 755 "$RUNNER_TEMP/coscli"
          "$RUNNER_TEMP/coscli" --version

      - name: Incremental sync to COS (concurrent with retries)
        shell: bash
        env:
          COS_BUCKET: ${{ env.COS_BUCKET }}
          COS_REGION: ${{ env.COS_REGION }}
          COS_SECRET_ID: ${{ env.COS_SECRET_ID }}
          COS_SECRET_KEY: ${{ env.COS_SECRET_KEY }}
          COS_CLEAN: ${{ vars.COS_CLEAN || 'true' }}
        run: |
          set -euo pipefail
          COSCLI="$RUNNER_TEMP/coscli"
          DESTINATION="cos://${COS_BUCKET}/"
          ENDPOINT="cos.${COS_REGION}.myqcloud.com"

          # sync skips files already matching at the destination, including
          # unchanged assets/cases, while transferring new or changed files.
          SYNC_ARGS=(
            sync dist "$DESTINATION"
            --recursive
            --routines 5
            --thread-num 4
            --retry-num 5
            --err-retry-num 5
            --err-retry-interval 2
            --check-point
            --force
            --secret-id "$COS_SECRET_ID"
            --secret-key "$COS_SECRET_KEY"
            --endpoint "$ENDPOINT"
          )

          # Preserve the workflow's previous clean behavior, but only when enabled.
          if [[ "$COS_CLEAN" == "true" ]]; then
            SYNC_ARGS+=(--delete)
          fi

          "$COSCLI" "${SYNC_ARGS[@]}"
